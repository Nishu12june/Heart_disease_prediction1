{% extends "base.html" %}

{% block title %}Patient Registration{% endblock %}
{% block page_title %}Patient Registration{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">
            <i class="fa-solid fa-user-plus"></i>
            Patient Registration
        </h4>
    </div>

    <div class="card-body">

        {% if patient %}

        <form action="{{ url_for('update_patient', patient_id=patient.id) }}" method="POST">

        {% else %}

        <form action="{{ url_for('registration') }}" method="POST">

        {% endif %}

            <div class="row">

                <!-- Patient ID -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Patient ID</label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ patient.id if patient else patient_id }}"
                        readonly>

                </div>

                <!-- Registration Date -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Registration Date</label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ today }}"
                        readonly>

                </div>

                <!-- Name -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ patient.name if patient else '' }}"
                        required>

                </div>

                <!-- Age -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Age</label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        min="1"
                        max="120"
                        value="{{ patient.age if patient else '' }}"
                        required>

                </div>

                <!-- Gender -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Gender</label>

                    <select
                        name="gender"
                        class="form-select"
                        required>

                        <option value="">Select Gender</option>

                        <option value="Male"
                        {% if patient and patient.gender=="Male" %}selected{% endif %}>
                        Male
                        </option>

                        <option value="Female"
                        {% if patient and patient.gender=="Female" %}selected{% endif %}>
                        Female
                        </option>

                        <option value="Other"
                        {% if patient and patient.gender=="Other" %}selected{% endif %}>
                        Other
                        </option>

                    </select>

                </div>

                <!-- Blood Group -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Blood Group</label>

                    <select
                        name="blood_group"
                        class="form-select">

                        {% set bg = patient.blood_group if patient else "" %}

                        {% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}

                        <option value="{{ b }}"
                        {% if bg==b %}selected{% endif %}>
                            {{ b }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Phone -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ patient.phone if patient else '' }}"
                        required>

                </div>

                <!-- Email -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ patient.email if patient else '' }}">

                </div>

                <!-- Emergency Contact -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Emergency Contact</label>

                    <input
                        type="text"
                        name="emergency_contact"
                        class="form-control"
                        value="{{ patient.emergency_contact if patient else '' }}">

                </div>

                <!-- Address -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">Address</label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="3">{{ patient.address if patient else '' }}</textarea>

                </div>

            </div>

            <hr>

            <button
                type="submit"
                class="btn btn-success">

                <i class="fa-solid fa-floppy-disk"></i>

                {% if patient %}

                Update Patient

                {% else %}

                Register Patient

                {% endif %}

            </button>

            <button
                type="reset"
                class="btn btn-secondary">

                Reset

            </button>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-danger">

                Back

            </a>

        </form>

    </div>

</div>

{% endblock %}
