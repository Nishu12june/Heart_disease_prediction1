{% extends "base.html" %}

{% block title %}Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4>

                    <i class="fa-solid fa-user"></i>

                    User Profile

                </h4>

            </div>

            <div class="card-body">

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='images/avatar.png') }}"
                        class="rounded-circle border"
                        width="140"
                        height="140">

                    <h3 class="mt-3">

                        {{ profile.name }}

                    </h3>

                    <p class="text-muted">

                        Heart Disease Prediction System

                    </p>

                </div>

                <form action="{{ url_for('update_profile') }}" method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                value="{{ profile.name }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                value="{{ profile.email }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Phone

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                value="{{ profile.phone }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Address

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="address"
                                value="{{ profile.address }}">

                        </div>

                    </div>

                    <hr>

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Profile

                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary">

                        Reset

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
